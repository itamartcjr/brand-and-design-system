name: Deploy brand documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build documentation site
        run: |
          mkdir -p dist
          node <<'NODE'
          const fs = require('node:fs');

          const html = String.raw`<!doctype html>
          <html lang="pt-BR" data-theme="light">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="description" content="Template central de Brand Book e Design System" />
              <title>Brand & Design System</title>
              <style>
                :root {
                  color-scheme: light;
                  --bg: #f7f7f8;
                  --surface: #ffffff;
                  --surface-subtle: #f1f1f3;
                  --text: #171719;
                  --muted: #6d6d75;
                  --border: #dedee3;
                  --accent: #171719;
                  --accent-contrast: #ffffff;
                  --focus: #5b5bd6;
                  --radius: 12px;
                  --sidebar: 272px;
                  --topbar: 64px;
                }

                html[data-theme="dark"] {
                  color-scheme: dark;
                  --bg: #101011;
                  --surface: #171719;
                  --surface-subtle: #202023;
                  --text: #f4f4f5;
                  --muted: #a0a0aa;
                  --border: #303035;
                  --accent: #f4f4f5;
                  --accent-contrast: #171719;
                  --focus: #8f8ff3;
                }

                * { box-sizing: border-box; }
                html, body { margin: 0; min-height: 100%; }
                body {
                  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                  background: var(--bg);
                  color: var(--text);
                  line-height: 1.5;
                }

                button, input, a { font: inherit; }
                button, a { -webkit-tap-highlight-color: transparent; }
                a { color: inherit; text-decoration: none; }
                :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

                .app {
                  min-height: 100vh;
                  display: grid;
                  grid-template-columns: var(--sidebar) minmax(0, 1fr);
                }

                .sidebar {
                  height: 100vh;
                  position: sticky;
                  top: 0;
                  display: flex;
                  flex-direction: column;
                  background: var(--surface);
                  border-right: 1px solid var(--border);
                  z-index: 20;
                }

                .brand {
                  height: var(--topbar);
                  display: flex;
                  align-items: center;
                  gap: 10px;
                  padding: 0 20px;
                  border-bottom: 1px solid var(--border);
                  font-weight: 720;
                  letter-spacing: -0.02em;
                }

                .mark {
                  width: 30px;
                  height: 30px;
                  border-radius: 9px;
                  display: grid;
                  place-items: center;
                  background: var(--accent);
                  color: var(--accent-contrast);
                  font-size: 12px;
                  font-weight: 800;
                }

                .nav {
                  padding: 18px 12px;
                  overflow: auto;
                  flex: 1;
                }

                .nav-label {
                  margin: 14px 10px 6px;
                  color: var(--muted);
                  font-size: 11px;
                  font-weight: 700;
                  letter-spacing: 0.08em;
                  text-transform: uppercase;
                }

                .nav-link {
                  display: flex;
                  align-items: center;
                  min-height: 40px;
                  padding: 0 12px;
                  border-radius: 9px;
                  color: var(--muted);
                  font-size: 14px;
                  font-weight: 570;
                }

                .nav-link:hover { background: var(--surface-subtle); color: var(--text); }
                .nav-link.active { background: var(--surface-subtle); color: var(--text); }
                .nav-link[hidden] { display: none; }

                .sidebar-footer {
                  padding: 14px 20px 18px;
                  color: var(--muted);
                  border-top: 1px solid var(--border);
                  font-size: 12px;
                }

                .workspace { min-width: 0; }

                .topbar {
                  height: var(--topbar);
                  position: sticky;
                  top: 0;
                  z-index: 15;
                  display: flex;
                  align-items: center;
                  gap: 16px;
                  padding: 0 24px;
                  background: color-mix(in srgb, var(--surface) 92%, transparent);
                  backdrop-filter: blur(14px);
                  border-bottom: 1px solid var(--border);
                }

                .menu-button { display: none; }
                .breadcrumb { min-width: max-content; font-size: 13px; color: var(--muted); }
                .breadcrumb strong { color: var(--text); }

                .search {
                  width: min(440px, 40vw);
                  margin-left: auto;
                  position: relative;
                }

                .search input {
                  width: 100%;
                  height: 38px;
                  padding: 0 14px 0 36px;
                  color: var(--text);
                  background: var(--surface-subtle);
                  border: 1px solid transparent;
                  border-radius: 10px;
                  outline: none;
                }

                .search input:focus { border-color: var(--border); background: var(--surface); }
                .search-icon { position: absolute; left: 12px; top: 8px; color: var(--muted); }

                .icon-button {
                  width: 38px;
                  height: 38px;
                  display: grid;
                  place-items: center;
                  color: var(--text);
                  background: var(--surface);
                  border: 1px solid var(--border);
                  border-radius: 10px;
                  cursor: pointer;
                }

                main { padding: 64px clamp(24px, 5vw, 72px) 96px; }
                .content { width: min(1180px, 100%); margin: 0 auto; }

                .eyebrow {
                  color: var(--muted);
                  font-size: 12px;
                  font-weight: 760;
                  letter-spacing: 0.08em;
                  text-transform: uppercase;
                }

                h1 {
                  max-width: 780px;
                  margin: 12px 0 18px;
                  font-size: clamp(40px, 5.5vw, 72px);
                  line-height: 0.98;
                  letter-spacing: -0.055em;
                }

                .lead {
                  max-width: 720px;
                  margin: 0;
                  color: var(--muted);
                  font-size: clamp(17px, 2vw, 20px);
                }

                .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
                .button {
                  min-height: 42px;
                  display: inline-flex;
                  align-items: center;
                  justify-content: center;
                  padding: 0 16px;
                  border-radius: 10px;
                  border: 1px solid var(--border);
                  background: var(--surface);
                  font-size: 14px;
                  font-weight: 650;
                }
                .button.primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }

                .section { margin-top: 72px; }
                .section-head { display: grid; gap: 8px; margin-bottom: 22px; }
                .section h2 { margin: 0; font-size: 26px; letter-spacing: -0.035em; }
                .section p { margin: 0; color: var(--muted); }

                .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
                .card {
                  min-height: 184px;
                  padding: 22px;
                  background: var(--surface);
                  border: 1px solid var(--border);
                  border-radius: var(--radius);
                }
                .card-index { color: var(--muted); font-size: 12px; font-weight: 700; }
                .card h3 { margin: 34px 0 8px; font-size: 18px; letter-spacing: -0.02em; }
                .card p { font-size: 14px; }

                .rules {
                  overflow: hidden;
                  background: var(--surface);
                  border: 1px solid var(--border);
                  border-radius: var(--radius);
                }
                .rule {
                  display: grid;
                  grid-template-columns: 180px 1fr;
                  gap: 28px;
                  padding: 20px 22px;
                  border-bottom: 1px solid var(--border);
                }
                .rule:last-child { border-bottom: 0; }
                .rule strong { font-size: 14px; }
                .rule span { color: var(--muted); font-size: 14px; }

                @media (max-width: 960px) {
                  :root { --sidebar: 232px; }
                  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
                  .search { width: min(320px, 36vw); }
                }

                @media (max-width: 720px) {
                  .app { grid-template-columns: 1fr; }
                  .sidebar {
                    position: fixed;
                    left: 0;
                    width: min(84vw, 292px);
                    transform: translateX(-105%);
                    transition: transform 180ms ease;
                    box-shadow: 12px 0 40px rgba(0,0,0,.12);
                  }
                  body.nav-open .sidebar { transform: translateX(0); }
                  .menu-button { display: grid; }
                  .breadcrumb span { display: none; }
                  .search { width: auto; flex: 1; }
                  main { padding-top: 44px; }
                  .grid { grid-template-columns: 1fr; }
                  .rule { grid-template-columns: 1fr; gap: 5px; }
                }
              </style>
            </head>
            <body>
              <div class="app">
                <aside class="sidebar" id="sidebar">
                  <div class="brand"><div class="mark">BD</div>Brand System</div>
                  <nav class="nav" aria-label="Documentação">
                    <div class="nav-label">Start</div>
                    <a class="nav-link active" href="#overview">Overview</a>
                    <div class="nav-label">Brand</div>
                    <a class="nav-link" href="#brand">Brand</a>
                    <a class="nav-link" href="#foundations">Foundations</a>
                    <div class="nav-label">Design System</div>
                    <a class="nav-link" href="#components">Components</a>
                    <a class="nav-link" href="#app">App</a>
                    <a class="nav-link" href="#web">Web</a>
                    <a class="nav-link" href="#assets">Assets</a>
                  </nav>
                  <div class="sidebar-footer">Template v0.1 · Documentation shell</div>
                </aside>

                <div class="workspace">
                  <header class="topbar">
                    <button class="icon-button menu-button" id="menuButton" aria-label="Abrir menu">☰</button>
                    <div class="breadcrumb"><span>Documentation / </span><strong>Overview</strong></div>
                    <label class="search">
                      <span class="search-icon">⌕</span>
                      <input id="search" type="search" placeholder="Buscar na documentação" aria-label="Buscar na documentação" />
                    </label>
                    <button class="icon-button" id="themeButton" aria-label="Alternar tema">◐</button>
                  </header>

                  <main id="overview">
                    <div class="content">
                      <div class="eyebrow">Brand Book + Design System</div>
                      <h1>Uma fonte única para preservar a essência de cada marca.</h1>
                      <p class="lead">Este template define uma estrutura consistente para estratégia de marca, fundamentos visuais, componentes e produtos digitais sem transformar todas as marcas na mesma coisa.</p>
                      <div class="actions">
                        <a class="button primary" href="https://www.figma.com/design/99947Dmc328mSa2FmYj5fP/Brand-e-Design-System?node-id=0-1" target="_blank" rel="noreferrer">Abrir Figma</a>
                        <a class="button" href="https://github.com/itamartcjr/brand-and-design-system" target="_blank" rel="noreferrer">Ver GitHub</a>
                      </div>

                      <section class="section" id="brand">
                        <div class="section-head"><h2>Arquitetura do sistema</h2><p>O conteúdo muda entre marcas; a lógica da documentação permanece previsível.</p></div>
                        <div class="grid">
                          <article class="card"><span class="card-index">01</span><h3>Brand</h3><p>Propósito, posicionamento, personalidade, voz, narrativa, marca e regras de aplicação.</p></article>
                          <article class="card" id="foundations"><span class="card-index">02</span><h3>Foundations</h3><p>Cores, tipografia, grid, espaçamento, radius, ícones, motion e tokens semânticos.</p></article>
                          <article class="card" id="components"><span class="card-index">03</span><h3>Components</h3><p>Biblioteca reutilizável com estados, propriedades, acessibilidade e especificações.</p></article>
                          <article class="card" id="app"><span class="card-index">04</span><h3>App</h3><p>Padrões de produto para experiências mobile, navegação e comportamento nativo.</p></article>
                          <article class="card" id="web"><span class="card-index">05</span><h3>Web</h3><p>Layouts, templates, responsividade e padrões para sites e aplicações web.</p></article>
                          <article class="card" id="assets"><span class="card-index">06</span><h3>Assets</h3><p>Logos, ícones, imagens, arquivos de distribuição e materiais prontos para uso.</p></article>
                        </div>
                      </section>

                      <section class="section">
                        <div class="section-head"><h2>Regras do template</h2><p>Princípios para o padrão continuar útil conforme novas marcas entram no sistema.</p></div>
                        <div class="rules">
                          <div class="rule"><strong>Estrutura neutra</strong><span>A interface da documentação não compete com a identidade documentada.</span></div>
                          <div class="rule"><strong>Grid de 8 px</strong><span>Espaçamento previsível, escalável e fácil de traduzir entre Figma e código.</span></div>
                          <div class="rule"><strong>Tokens primeiro</strong><span>Valores visuais devem evoluir para primitives e semantic tokens antes de componentes.</span></div>
                          <div class="rule"><strong>Uma fonte de verdade</strong><span>Figma e GitHub precisam compartilhar nomes, estrutura e intenção, mesmo quando a implementação for diferente.</span></div>
                        </div>
                      </section>
                    </div>
                  </main>
                </div>
              </div>

              <script>
                const root = document.documentElement;
                const themeButton = document.getElementById('themeButton');
                const search = document.getElementById('search');
                const menuButton = document.getElementById('menuButton');
                const savedTheme = localStorage.getItem('brand-docs-theme');

                if (savedTheme === 'dark' || savedTheme === 'light') root.dataset.theme = savedTheme;

                themeButton.addEventListener('click', function () {
                  const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
                  root.dataset.theme = next;
                  localStorage.setItem('brand-docs-theme', next);
                });

                menuButton.addEventListener('click', function () {
                  document.body.classList.toggle('nav-open');
                });

                document.querySelectorAll('.nav-link').forEach(function (link) {
                  link.addEventListener('click', function () {
                    document.body.classList.remove('nav-open');
                    document.querySelectorAll('.nav-link').forEach(function (item) { item.classList.remove('active'); });
                    link.classList.add('active');
                  });
                });

                search.addEventListener('input', function () {
                  const term = search.value.trim().toLowerCase();
                  document.querySelectorAll('.nav-link').forEach(function (link) {
                    link.hidden = term.length > 0 && !link.textContent.toLowerCase().includes(term);
                  });
                });
              </script>
            </body>
          </html>`;

          fs.writeFileSync('dist/index.html', html, 'utf8');
          console.log('Generated dist/index.html');
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
