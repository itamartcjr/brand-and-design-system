<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Template reutilizável de Brand Book e Design System" />
    <meta name="theme-color" content="#ffffff" />
    <title>Brand & Design System</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .compact-code{margin-top:16px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px}.compact-code select,.system-code select{height:48px;padding:0 32px 0 12px;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font:inherit;font-size:12px;font-weight:750}.compact-copy,.system-copy{min-width:0;height:48px;padding:0 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;cursor:copy}.compact-copy code,.system-copy code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.compact-copy span,.system-copy span{color:var(--muted)}
      .color-usage{margin-top:12px;padding:12px;display:grid;gap:7px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px}.color-usage>div:first-child{display:flex;justify-content:space-between;gap:12px}.color-usage span,.color-usage small{color:var(--muted)}.color-usage span{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.color-usage strong{font-size:15px}.color-usage small{font-size:10px}.usage-track{height:7px;overflow:hidden;border-radius:999px;background:var(--surface-3)}.usage-track i{display:block;height:100%;min-width:3px;border-radius:inherit;background:var(--accent)}
      .display-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.display-grid article{padding:12px 12px 17px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}.display-grid strong,.display-grid p{display:block;margin-inline:5px}.display-grid strong{margin-top:13px}.display-grid p{margin-top:4px;margin-bottom:0;color:var(--muted);font-size:12px}.display-preview{height:168px;overflow:hidden;position:relative;border-radius:14px;background:var(--surface-2)}.cards-view{padding:11px;display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.cards-view i{border-radius:8px}.mosaic-view{padding:9px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:5px}.mosaic-view i{border-radius:5px}.mosaic-view i:first-child{grid-row:span 2;grid-column:span 2}.shapes-view i{position:absolute;width:78px;height:78px;border-radius:50%}.shapes-view i:nth-child(1){width:110px;height:110px;left:14px;top:28px;border-radius:36% 64% 62% 38%/54% 39% 61% 46%}.shapes-view i:nth-child(2){right:13px;top:13px}.shapes-view i:nth-child(3){right:34px;bottom:-18px;width:98px;height:98px;border-radius:30% 70% 40% 60%}.shapes-view i:nth-child(4){left:94px;top:-23px;width:62px;height:62px}.editorial-view{background:#0f172a}.editorial-view i{position:absolute;display:block;transform:rotate(-11deg);border-radius:5px}.editorial-view i:nth-child(1){inset:-30px 62% -25px -20px}.editorial-view i:nth-child(2){inset:-18px 36% -35px 35%}.editorial-view i:nth-child(3){inset:-28px 14% -20px 59%}.editorial-view i:nth-child(4){width:60px;height:60px;right:14px;top:14px;border-radius:50%;transform:none}
      .proportion-panel{padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}.proportion-bar{height:64px;display:flex;overflow:hidden;border-radius:13px}.proportion-bar i{display:grid;place-items:center;color:#fff;font-style:normal;text-shadow:0 1px 4px #0005}.proportion-bar i:nth-child(1){background:#2563eb}.proportion-bar i:nth-child(2){background:#7c3aed}.proportion-bar i:nth-child(3){background:#475569}.proportion-bar span{font-size:12px;font-weight:800}.proportion-legend{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.proportion-legend div{display:grid;grid-template-columns:11px 1fr;gap:2px 8px}.proportion-legend i{width:10px;height:10px;border-radius:50%;grid-row:1/span 2}.proportion-legend div:nth-child(1) i{background:#2563eb}.proportion-legend div:nth-child(2) i{background:#7c3aed}.proportion-legend div:nth-child(3) i{background:#475569}.proportion-legend strong{font-size:13px}.proportion-legend span{color:var(--muted);font-size:11px}
      .system-color-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.system-card{min-width:0;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow)}.system-card.accent-card{border-style:dashed}.system-head{display:flex;align-items:center;gap:12px}.system-symbol{width:42px;height:42px;display:grid;place-items:center;flex:0 0 auto;border-radius:12px;background:color-mix(in srgb,var(--status) 15%,var(--surface));color:var(--status);border:1px solid color-mix(in srgb,var(--status) 38%,var(--border));font-size:18px;font-weight:850}.system-head p{margin:0 0 2px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.system-head h3{margin:0;font-size:19px}.system-role{margin:13px 0 8px;color:var(--muted);font-size:13px}.system-token{display:block;margin-bottom:14px;color:var(--muted);font-size:11px}.system-mode{padding:10px;display:grid;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px}.system-mode+.system-mode{margin-top:8px}.mode-head{display:flex;align-items:center;justify-content:space-between}.mode-head span{color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.mode-head i{width:25px;height:25px;border-radius:7px;border:1px solid #8883}.system-code{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px}.system-code select,.system-copy{height:40px;background:var(--surface)}.system-note{margin-top:14px;padding:17px 19px;display:grid;grid-template-columns:150px 1fr;gap:18px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius)}.system-note p{margin:0;color:var(--muted)}
      @media(max-width:1100px){.display-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.compact-code{grid-template-columns:92px minmax(0,1fr)}.display-grid,.system-color-grid,.proportion-legend{grid-template-columns:1fr}.display-preview{height:188px}.system-note{grid-template-columns:1fr;gap:5px}.system-code{grid-template-columns:86px minmax(0,1fr)}}
    </style>
  </head>
  <body>
    <div class="backdrop" id="backdrop" aria-hidden="true"></div>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Navegação da documentação">
        <header class="sidebar-header">
          <a class="brand-home" href="#/overview" aria-label="Brand System — início"><span class="brand-mark">BD</span><span class="brand-name"><strong>Brand System</strong><small>Documentation standard</small></span></a>
          <button class="icon-button drawer-close" id="drawerClose" type="button" aria-label="Fechar menu">×</button>
        </header>
        <div class="sidebar-search"><label class="search-field"><span aria-hidden="true">⌕</span><input id="navSearch" type="search" placeholder="Buscar páginas" /></label></div>
        <nav class="nav" id="nav"></nav>
        <footer class="sidebar-footer">Template v0.6 · Flexible color system</footer>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <button class="icon-button menu-button" id="menuButton" type="button" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false">☰</button>
          <div class="breadcrumb"><span>Documentation / </span><strong id="pageTitle">Overview</strong></div><div class="topbar-spacer"></div>
          <a class="topbar-link" href="https://www.figma.com/design/99947Dmc328mSa2FmYj5fP/Brand-e-Design-System?node-id=0-1" target="_blank" rel="noreferrer">Figma</a>
          <a class="topbar-link" href="https://github.com/itamartcjr/brand-and-design-system" target="_blank" rel="noreferrer">GitHub</a>
          <button class="icon-button" id="themeButton" type="button" aria-label="Alternar tema">◐</button>
        </header>
        <main id="app" tabindex="-1"></main>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
    <script type="module">
      const app=document.getElementById('app');
      const usage=new Map([['Blue 50',6],['Blue 100',5],['Blue 300',3],['Blue 500',4],['Blue 600',10],['Blue 700',5],['Blue 900',4],['Violet 400',2],['Violet 600',3],['Pink 500',2],['Amber 500',2],['Emerald 500',2],['Neutral 0',18],['Neutral 50',12],['Neutral 200',6],['Neutral 500',5],['Neutral 800',5],['Neutral 950',6]]);
      const groups=[['Primary',37,'Reconhecimento, ações e momentos de marca.'],['Secondary',11,'Apoio, expressão e acentos controlados.'],['Neutral',52,'Superfícies, texto, divisores e espaço visual.']];
      const displayColors=['#93C5FD','#3B82F6','#2563EB','#1D4ED8','#1E3A8A'];
      const statuses=[
        ['Information','status/information','#2563EB','#60A5FA','Informação, progresso e contexto útil.','i','semantic'],
        ['Confirmation','status/success','#15803D','#4ADE80','Sucesso, confirmação e estado concluído.','✓','semantic'],
        ['Attention','status/warning','#B45309','#FBBF24','Atenção, cautela e prevenção de erro.','!','semantic'],
        ['Danger','status/danger','#B91C1C','#F87171','Erro grave, destruição, risco e bloqueio.','×','semantic'],
        ['Discovery','status/discovery','#7C3AED','#C4B5FD','Novidade, onboarding e descoberta de recurso.','✦','semantic'],
        ['Neutral','status/neutral','#64748B','#94A3B8','Estado padrão, inativo ou sem significado específico.','—','semantic'],
        ['Complementary Cool','accent/cool','#0F766E','#5EEAD4','Acento complementar sem significado semântico.','◆','accent'],
        ['Complementary Warm','accent/warm','#C2410C','#FDBA74','Acento complementar sem significado semântico.','●','accent']
      ];
      const refs=[
        ['Autodesk Brand Hub — Color','https://brand.autodesk.com/visual-system/color/','Proporções, hierarquia primary/secondary/tertiary e Pantone oficial.'],
        ['USWDS — Theme color tokens','https://designsystem.digital.gov/design-tokens/color/theme-tokens/','Referência 60/30/10 para famílias não-neutras; guia, não regra universal.'],
        ['Atlassian Design — Color roles','https://atlassian.design/foundations/color/','Roles information, success, warning, danger, discovery, neutral e accent.'],
        ['Atlassian Design — Accents','https://atlassian.design/foundations/color/accents','Accents não carregam significado e podem ser trocados sem alterar a experiência.']
      ];
      function rgb(hex){const n=parseInt(hex.slice(1),16);return{r:n>>16&255,g:n>>8&255,b:n&255}}
      function hsl({r,g,b}){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h=0,s=0,l=(max+min)/2;if(max!==min){const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);h=max===r?(g-b)/d+(g<b?6:0):max===g?(b-r)/d+2:(r-g)/d+4;h/=6}return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)}}
      function cmyk({r,g,b}){if(!r&&!g&&!b)return{c:0,m:0,y:0,k:100};const rn=r/255,gn=g/255,bn=b/255,k=1-Math.max(rn,gn,bn);return{c:Math.round((1-rn-k)/(1-k)*100),m:Math.round((1-gn-k)/(1-k)*100),y:Math.round((1-bn-k)/(1-k)*100),k:Math.round(k*100)}}
      function formats(hex,token='--color-example'){const x=rgb(hex),y=hsl(x),z=cmyk(x);return[['HEX',hex.toUpperCase()],['RGB',`rgb(${x.r}, ${x.g}, ${x.b})`],['RGBA',`rgba(${x.r}, ${x.g}, ${x.b}, 1)`],['HSL',`hsl(${y.h}, ${y.s}%, ${y.l}%)`],['CMYK',`${z.c}, ${z.m}, ${z.y}, ${z.k}`],['CSS',`var(${token})`],['SwiftUI',`Color(red: ${(x.r/255).toFixed(3)}, green: ${(x.g/255).toFixed(3)}, blue: ${(x.b/255).toFixed(3)})`],['Android',`Color(0xFF${hex.slice(1).toUpperCase()})`]]}
      function compact(grid){if(!grid||grid.dataset.done)return;const values=[...grid.querySelectorAll('[data-copy]')].map(b=>[b.querySelector('span:first-child')?.textContent?.trim()||'Value',b.dataset.copy]).filter(x=>x[1]);if(!values.length)return;const box=document.createElement('div');box.className='compact-code';const select=document.createElement('select');select.setAttribute('aria-label','Formato da cor');values.forEach((v,i)=>select.add(new Option(v[0],i)));const btn=document.createElement('button');btn.type='button';btn.className='compact-copy';btn.innerHTML='<code></code><span aria-hidden="true">⧉</span>';const update=()=>{const v=values[+select.value||0];btn.dataset.copy=v[1];btn.querySelector('code').textContent=v[1]};select.onchange=update;update();box.append(select,btn);grid.replaceWith(box)}
      function section(title,overline,description){const s=document.createElement('section');s.className='doc-section';s.innerHTML=`<div class="section-heading"><div><p class="overline">${overline}</p><h2>${title}</h2></div><p>${description}</p></div>`;return s}
      function find(title){return[...app.querySelectorAll('.doc-section')].find(s=>s.querySelector('h2')?.textContent.includes(title))}
      function codePicker(hex,token){const f=formats(hex,token),opts=f.map((x,i)=>`<option value="${i}">${x[0]}</option>`).join('');return`<div class="system-code" data-values='${JSON.stringify(f)}'><select aria-label="Formato da cor">${opts}</select><button class="system-copy" type="button" data-copy="${f[0][1]}"><code>${f[0][1]}</code><span aria-hidden="true">⧉</span></button></div>`}
      function enhance(){if(!location.hash.startsWith('#/colors')||app.querySelector('[data-color-v06]'))return;const mark=document.createElement('i');mark.hidden=true;mark.dataset.colorV06='1';app.prepend(mark);
        app.querySelectorAll('.copy-grid').forEach(compact);
        app.querySelectorAll('.color-card').forEach(card=>{const name=card.querySelector('h3')?.textContent.trim(),pct=usage.get(name);if(pct==null)return;const b=document.createElement('div');b.className='color-usage';b.innerHTML=`<div><span>Uso sugerido</span><strong>${pct}%</strong></div><div class="usage-track" role="img" aria-label="Uso sugerido ${pct}%"><i style="width:${pct}%"></i></div><small>Exemplo de distribuição. Cada marca define sua proporção.</small>`;card.querySelector('.color-card-body')?.insertBefore(b,card.querySelector('.pantone-row'))});
        const flexible=section('A informação é fixa. A forma de exibir pode mudar.','Flexible expression','O template exige valores, porcentagem, função e acessibilidade, mas a composição visual pode acompanhar a personalidade da marca: cards, mosaicos, formas, faixas editoriais ou outra linguagem coerente.');flexible.innerHTML+=`<div class="display-grid"><article><div class="display-preview cards-view">${displayColors.slice(0,4).map(c=>`<i style="background:${c}"></i>`).join('')}</div><strong>Cards</strong><p>Documentação técnica e leitura direta.</p></article><article><div class="display-preview mosaic-view">${displayColors.map(c=>`<i style="background:${c}"></i>`).join('')}</div><strong>Mosaico</strong><p>Proporção e peso visual como parte da identidade.</p></article><article><div class="display-preview shapes-view">${displayColors.slice(0,4).map(c=>`<i style="background:${c}"></i>`).join('')}</div><strong>Formas</strong><p>Círculos, blobs e geometrias da linguagem da marca.</p></article><article><div class="display-preview editorial-view">${displayColors.slice(0,4).map(c=>`<i style="background:${c}"></i>`).join('')}</div><strong>Editorial</strong><p>Faixas e composição livre para marcas expressivas.</p></article></div>`;app.querySelector('.callout')?.closest('.doc-section')?.after(flexible);
        const prop=section('Porcentagem de uso','Color proportion','Cada card mostra a participação sugerida da cor. O exemplo abaixo inclui neutros e é específico desta marca-modelo; referências como USWDS usam 60/30/10 para famílias não-neutras, enquanto outras marcas definem proporções próprias.');prop.innerHTML+=`<div class="proportion-panel"><div class="proportion-bar">${groups.map((g,i)=>`<i style="width:${g[1]}%"><span>${g[1]}%</span></i>`).join('')}</div><div class="proportion-legend">${groups.map(g=>`<div><i></i><strong>${g[0]} · ${g[1]}%</strong><span>${g[2]}</span></div>`).join('')}</div></div>`;find('Neutros')?.after(prop);
        const sys=section('Cores de estado e complementação','System colors','Brand colors constroem reconhecimento; system colors comunicam intenção. Atenção, perigo e confirmação têm significado estável. Accents complementares não carregam significado e podem variar sem mudar a mensagem.');sys.innerHTML+=`<div class="system-color-grid">${statuses.map(s=>{const token='--'+s[1].replaceAll('/','-');return`<article class="system-card ${s[6]==='accent'?'accent-card':''}"><div class="system-head"><span class="system-symbol" style="--status:${s[2]}">${s[5]}</span><div><p>${s[6]==='accent'?'Complementary accent':'Semantic status'}</p><h3>${s[0]}</h3></div></div><p class="system-role">${s[4]}</p><code class="system-token">${s[1]}</code><div class="system-mode"><div class="mode-head"><span>Light</span><i style="background:${s[2]}"></i></div>${codePicker(s[2],token)}</div><div class="system-mode"><div class="mode-head"><span>Dark</span><i style="background:${s[3]}"></i></div>${codePicker(s[3],token)}</div></article>`}).join('')}</div><div class="system-note"><strong>Regra de significado</strong><p>Não use accent para representar warning, success ou danger. E não dependa só da cor: combine status com texto, ícone, forma ou outra pista visual.</p></div>`;find('Totalização Light & Dark')?.after(sys);sys.querySelectorAll('.system-code').forEach(p=>{const sel=p.querySelector('select'),btn=p.querySelector('button'),vals=JSON.parse(p.dataset.values);sel.onchange=()=>{const v=vals[+sel.value||0];btn.dataset.copy=v[1];btn.querySelector('code').textContent=v[1]}});
        const list=app.querySelector('.references-section .reference-list');if(list)refs.forEach(r=>{if(list.querySelector(`a[href="${r[1]}"]`))return;const a=document.createElement('a');a.className='reference-item';a.href=r[1];a.target='_blank';a.rel='noreferrer';a.innerHTML=`<div><strong>${r[0]}</strong><p>${r[2]}</p></div><span aria-hidden="true">↗</span>`;list.append(a)});
      }
      new MutationObserver(enhance).observe(app,{childList:true});window.addEventListener('hashchange',()=>queueMicrotask(enhance));queueMicrotask(enhance);
    </script>
  </body>
</html>
